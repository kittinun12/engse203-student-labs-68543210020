name: CI Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 🟢 กำหนด working directory ชี้ไปที่ labs/week-12/source ตามที่โจทย์กำหนด
    defaults:
      run:
        working-directory: labs/week-12/source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test